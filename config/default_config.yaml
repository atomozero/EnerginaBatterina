progetto:
  nome: "Impianto Residenziale Roma"
  descrizione: "Dimensionamento PV 6kWp + batteria 10kWh"
  anno_riferimento: 2024

meteo:
  localita:
    latitudine: 41.9028
    longitudine: 12.4964
    altitudine: 21
    nome: "Roma"
  sorgente_dati: "pvgis_tmy"  # pvgis_tmy | open_meteo
  anno: 2023  # usato solo per open_meteo

fotovoltaico:
  impianto:
    potenza_nominale_kwp: 6.0
    inclinazione_gradi: 30
    azimut_gradi: 180  # 180=Sud, 90=Est, 270=Ovest
    perdite_sistema_pct: 14.0
    degradazione_annua_pct: 0.5
  modulo:
    tipo: "monocristallino"
    potenza_wp: 400
    efficienza_pct: 20.5
    coeff_temp_pmax_pct_c: -0.35
  inverter:
    efficienza_nominale_pct: 97.0
    rapporto_dc_ac: 1.2

pun:
  zona_mercato: "CSUD"  # CNOR, CSUD, NORD, SUD, SICI, SARD
  anno: 2024
  tariffa_acquisto:
    tipo: "pun_indicizzata"  # pun_indicizzata | fissa
    prezzo_fisso_eur_kwh: null
    oneri_sistema_eur_kwh: 0.08
    accise_eur_kwh: 0.0227
    iva_pct: 10.0
  tariffa_vendita:
    tipo: "ritiro_dedicato"
    prezzo_minimo_garantito_eur_kwh: 0.04

edificio:
  tipologia: "residenziale"  # residenziale | ufficio | industriale
  parametri:
    superficie_mq: 120
    n_occupanti: 4
    potenza_contratto_kw: 4.5
    consumo_annuo_kwh: null  # se null, calcolato dal profilo
  climatizzazione:
    riscaldamento: "pompa_di_calore"  # pompa_di_calore | gas | no
    raffrescamento: true
    cop_medio: 3.5
    eer_medio: 3.0

contatore:
  tipo: "bidirezionale"

batteria:
  abilitata: true
  specifiche:
    capacita_nominale_kwh: 10.0
    potenza_max_kw: 5.0
    soc_min_pct: 10.0
    soc_max_pct: 90.0
    efficienza_carica_pct: 95.0
    efficienza_scarica_pct: 95.0
    chimica: "LFP"  # LFP | NMC
  strategia: "autoconsumo"  # autoconsumo | arbitraggio | ibrida
  degradazione:
    modello: "lineare"  # lineare | rainflow
    cicli_vita: 6000
    capacita_fine_vita_pct: 80.0

incentivi:
  detrazione_fiscale:
    abilitata: true
    aliquota_pct: 50.0
    anni_detrazione: 10
    tetto_spesa_eur: 96000
  ritiro_dedicato:
    abilitato: true
  cer:
    abilitata: false
    tariffa_incentivante_eur_kwh: 0.11

economico:
  investimento:
    costo_pv_eur: 9000
    costo_batteria_eur: 6000
    costo_installazione_eur: 2000
    costo_progettazione_eur: 500
  costi_esercizio:
    manutenzione_annua_eur: 200
    assicurazione_annua_eur: 100
    sostituzione_inverter_anno: 12
    costo_inverter_eur: 1500
  parametri:
    tasso_sconto_pct: 5.0
    vita_utile_anni: 25
    inflazione_pct: 2.0
    escalation_prezzo_energia_pct: 3.0

previsione:
  orizzonte_anni: 25
  metodo_prezzi: "trend_lineare"  # trend_lineare | sarima
  metodo_produzione: "degradazione"  # degradazione | sarima

sensibilita:
  variabili:
    - nome: "costo_pv_eur"
      min_pct: -30
      max_pct: 30
      passi: 5
    - nome: "prezzo_energia"
      min_pct: -20
      max_pct: 40
      passi: 5
    - nome: "potenza_nominale_kwp"
      valori: [3.0, 4.5, 6.0, 9.0, 12.0]
    - nome: "capacita_nominale_kwh"
      valori: [0, 5.0, 10.0, 15.0, 20.0]

report:
  formato: "pdf"
  lingua: "it"
  sezioni:
    - sommario
    - dati_meteo
    - produzione_pv
    - consumi
    - bilancio_energetico
    - accumulo
    - analisi_economica
    - previsioni
    - sensibilita
