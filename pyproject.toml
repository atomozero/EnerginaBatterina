[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "energina-batterina"
version = "0.1.0"
description = "Piattaforma modulare per trading energia rinnovabile e dimensionamento impianti PV+accumulo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "EnerginaBatterina Team"},
]
keywords = ["fotovoltaico", "batteria", "energia", "PUN", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy>=1.24",
    "pandas>=2.0",
    "pvlib>=0.10",
    "openmeteo-requests>=1.2",
    "requests-cache>=1.1",
    "mercati-energetici>=0.5",
    "numpy-financial>=1.0",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
energina = "energina.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
